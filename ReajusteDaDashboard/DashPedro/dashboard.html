<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Monitoramento de GLP</title>
    <link rel="stylesheet" href="dashboard-style.css">
    <script src="../js/sessao.js"></script>
    <script src="./cozinhas-store.js"></script>
</head>
<body class="dashboard-page" onload="validarSessao()">
    <div class="janela com-sidebar">
        <div class="layout-lateral">
            <aside class="sidebar" aria-label="Navegação principal">
                <a class="brand sidebar-brand" href="../index.html" aria-label="AnzenTech - Início">
                    <img src="../assets/icon/安.png" alt="">
                    <span>Anzen<span>Tech</span></span>
                </a>

                <nav class="sidebar-nav" aria-label="Páginas">
                    <a class="side-link" href="../index.html">Início</a>
                    <a class="side-link ativo" href="./dashboard.html" aria-current="page">Monitoramento Cozinhas</a>
                    <a class="side-link" href="./configuracoes.html">Configurações</a>
                </nav>

                <p class="sidebar-subtitulo">Cozinhas</p>
                <nav class="side-abas" id="abas-cozinhas" aria-label="Cozinhas"></nav>

                <div class="sidebar-footer">
                    <p class="sidebar-user">Olá, <span id="b_usuario">usuário</span></p>
                    <button class="btn-logout" type="button" onclick="limparSessao()">Sair</button>
                </div>
            </aside>

            <div class="conteudo-lateral">
                <header class="dashboard-intro">
                    <div class="intro-linha">
                        <h1>Monitoramento Cozinhas</h1>
                        <div class="intro-acoes">
                            <div class="campo-pesquisa">
                                <label class="sr-only" for="pesquisa-cozinhas">Pesquisar cozinhas</label>
                                <input type="search" id="pesquisa-cozinhas" placeholder="Pesquisar cozinha" autocomplete="off">
                            </div>
                            <form class="form-add-cozinha" id="form-add-cozinha">
                                <label class="sr-only" for="nova-cozinha">Nome da nova cozinha</label>
                                <input type="text" id="nova-cozinha" placeholder="Nome da nova cozinha" maxlength="40" required autocomplete="off">
                                <button type="submit">Adicionar cozinha</button>
                            </form>
                        </div>
                    </div>
                    <p class="form-aviso" id="add-aviso" hidden></p>
                </header>

                <main class="dashboard-conteudo">
                    <section class="view" id="view-geral" aria-label="Visão geral das cozinhas">
                        <ul class="cozinhas-lista" id="cozinhas-lista"></ul>
                        <p class="lista-vazio" id="lista-vazio" hidden>Nenhuma cozinha encontrada para a pesquisa.</p>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const LIMITE_ATENCAO = 300;
        const LIMITE_CRITICO = 1000;
        const DIAS_HISTORICO = 45;
        const HORA = 3600000;

        const NIVEIS = {
            normal:  { rotulo: 'Normal',  selo: 'NORMAL',  acao: 'Sem ação. Rotina normal.',       cor: '#10B981' },
            atencao: { rotulo: 'Atenção', selo: 'ATENÇÃO', acao: 'Ventile e verifique mangueira e regulador.', cor: '#F59E0B' },
            critico: { rotulo: 'Crítico', selo: 'CRÍTICO', acao: 'Feche o registro · Ventile · Evacue · Ligue 193', cor: '#EF4444' }
        };
        const PESO = { normal: 0, atencao: 1, critico: 2 };

        const COZINHAS = CozinhasStore.listar();
        const SENSORES = [
            { id: 1, nome: 'Fogão' },
            { id: 2, nome: 'Central de GLP' },
            { id: 3, nome: 'Forno' }
        ];

        function nivelDe(ppm) {
            if (ppm >= LIMITE_CRITICO) return 'critico';
            if (ppm > LIMITE_ATENCAO) return 'atencao';
            return 'normal';
        }
        function nomeSensor(s) { return 'Sensor ' + SENSORES[s].id + ' · ' + SENSORES[s].nome; }

        function mulberry32(semente) {
            return function () {
                semente |= 0; semente = (semente + 0x6D2B79F5) | 0;
                let t = Math.imul(semente ^ (semente >>> 15), 1 | semente);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        const agora = new Date(); agora.setMinutes(0, 0, 0);
        const inicioHoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
        const inicioDados = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() - (DIAS_HISTORICO - 1));
        const N = Math.round((agora - inicioDados) / HORA) + 1;
        const ULTIMO = N - 1;

        function horaDoIndice(i) { return new Date(inicioDados.getTime() + i * HORA); }
        function indiceDaData(d) { return Math.round((d - inicioDados) / HORA); }

        const leituras = {};
        function gerarLeituras(c) {
            leituras[c.id] = SENSORES.map(function (sensor, s) {
                const rnd = mulberry32(c.id * 100 + s * 7 + 13);
                const base = 45 + rnd() * 40;
                const picoAlmoco = 50 + rnd() * 55;
                const picoJantar = 50 + rnd() * 55;
                const serie = [];
                for (let i = 0; i < N; i++) {
                    const h = horaDoIndice(i).getHours();
                    const v = base
                        + picoAlmoco * Math.exp(-Math.pow(h - 12, 2) / (2 * 1.6 * 1.6))
                        + picoJantar * Math.exp(-Math.pow(h - 19, 2) / (2 * 1.8 * 1.8))
                        + (rnd() - 0.5) * 40;
                    serie.push(Math.max(20, Math.round(v)));
                }
                return serie;
            });
        }
        COZINHAS.forEach(gerarLeituras);

        const INCIDENTES = [
            [1, 0, 2, 13, 330], [1, 1, 9, 15, 420],
            [2, 2, 3, 12, 1080], [2, 0, 12, 19, 540],
            [3, 1, 1, 18, 1210], [3, 0, 6, 10, 780], [3, 2, 16, 14, 1040],
            [4, 2, 5, 14, 350], [4, 0, 20, 11, 1020]
        ];
        const FORMA_INCIDENTE = [0.35, 0.7, 1, 0.6, 0.3];
        INCIDENTES.forEach(function (inc) {
            const dia = new Date(inicioHoje.getFullYear(), inicioHoje.getMonth(), inicioHoje.getDate() - inc[2], inc[3]);
            const centro = indiceDaData(dia);
            FORMA_INCIDENTE.forEach(function (f, j) {
                const i = centro - 2 + j;
                if (i < 0 || i > ULTIMO) return;
                if (!leituras[inc[0]] || !leituras[inc[0]][inc[1]]) return;
                const serie = leituras[inc[0]][inc[1]];
                serie[i] = Math.max(serie[i], Math.round(inc[4] * f));
            });
        });

        const SITUACAO_ATUAL = [
            [2, 0, [190, 230, 280, 330, 360, 380]],
            [3, 1, [320, 380, 520, 900, 1350, 1100]],
            [3, 2, [150, 190, 260, 350, 420, 450]]
        ];
        SITUACAO_ATUAL.forEach(function (x) {
            if (!leituras[x[0]] || !leituras[x[0]][x[1]]) return;
            x[2].forEach(function (v, j) { leituras[x[0]][x[1]][N - 6 + j] = v; });
        });

        function atuais(c) { return leituras[c].map(function (serie) { return serie[ULTIMO]; }); }

        function statusCozinha(c) {
            const valores = atuais(c);
            let nivel = 'normal', maior = 0;
            valores.forEach(function (ppm, s) {
                if (PESO[nivelDe(ppm)] > PESO[nivel]) nivel = nivelDe(ppm);
                if (ppm > valores[maior]) maior = s;
            });
            return { nivel: nivel, maior: maior, ppm: valores[maior], valores: valores };
        }

        function cozinhasOrdenadas() {
            return COZINHAS.slice().sort(function (a, b) {
                const sa = statusCozinha(a.id), sb = statusCozinha(b.id);
                return PESO[sb.nivel] - PESO[sa.nivel] || sb.ppm - sa.ppm || a.id - b.id;
            });
        }

        const fmtPPM = function (n) { return Number(n).toLocaleString('pt-BR'); };

        const lista = document.getElementById('cozinhas-lista');
        const listaVazia = document.getElementById('lista-vazio');
        const abas = document.getElementById('abas-cozinhas');
        const campoPesquisa = document.getElementById('pesquisa-cozinhas');
        const formAdicionar = document.getElementById('form-add-cozinha');
        const campoNova = document.getElementById('nova-cozinha');
        const avisoAdd = document.getElementById('add-aviso');
        let termoPesquisa = '';

        function cozinhasFiltradas() {
            if (!termoPesquisa) return cozinhasOrdenadas();
            return cozinhasOrdenadas().filter(function (c) {
                return c.nome.toLocaleLowerCase('pt-BR').indexOf(termoPesquisa) !== -1;
            });
        }

        function renderSidebar() {
            abas.innerHTML = cozinhasOrdenadas().map(function (c) {
                const st = statusCozinha(c.id);
                return '<a class="side-link side-cozinha" href="./cozinhas.html#cozinha-' + c.id + '">'
                    + '<span class="ponto ponto-' + st.nivel + '" aria-hidden="true"></span>'
                    + '<span>' + CozinhasStore.escapar(c.nome) + '</span>'
                    + '<span class="sr-only">, status ' + NIVEIS[st.nivel].rotulo.toLowerCase() + '</span></a>';
            }).join('');
        }

        function renderLista() {
            const cozinhas = cozinhasFiltradas();
            lista.innerHTML = cozinhas.map(function (c) {
                const st = statusCozinha(c.id);
                const nv = NIVEIS[st.nivel];
                const nome = CozinhasStore.escapar(c.nome);
                return '<li class="lista-item">'
                    + '<a class="cz-row cz-' + st.nivel + '" href="./cozinhas.html#cozinha-' + c.id + '"'
                    + ' aria-label="' + nome + ': status ' + nv.rotulo.toLowerCase() + '. Abrir painel da cozinha">'
                    + '<span class="ponto ponto-' + st.nivel + '" aria-hidden="true"></span>'
                    + '<div class="cz-row-principal">'
                    + '<div class="cz-row-topo"><h2>' + nome + '</h2><span class="selo selo-' + st.nivel + '">' + nv.selo + '</span></div>'
                    + '<p class="cz-acao">' + nv.acao + '</p>'
                    + '</div>'
                    + '<div class="cz-row-leitura">'
                    + '<p class="cz-ppm">' + fmtPPM(st.ppm) + ' <span>PPM</span></p>'
                    + '<p class="cz-ref">Maior leitura agora</p>'
                    + '<p class="cz-ref cz-ref-sensor">' + nomeSensor(st.maior) + '</p>'
                    + '</div>'
                    + '<span class="cz-row-abrir">Abrir painel <span aria-hidden="true">&rarr;</span></span>'
                    + '</a></li>';
            }).join('');
            listaVazia.hidden = cozinhas.length !== 0;
        }

        campoPesquisa.addEventListener('input', function () {
            termoPesquisa = campoPesquisa.value.trim().toLocaleLowerCase('pt-BR');
            renderLista();
        });

        formAdicionar.addEventListener('submit', function (evento) {
            evento.preventDefault();
            const cozinha = CozinhasStore.adicionar(campoNova.value);
            if (!cozinha) {
                avisoAdd.textContent = 'Informe um nome válido para a cozinha.';
                avisoAdd.hidden = false;
                return;
            }
            COZINHAS.push(cozinha);
            gerarLeituras(cozinha);
            campoNova.value = '';
            avisoAdd.hidden = true;
            renderSidebar();
            renderLista();
        });

        renderSidebar();
        renderLista();
    })();
    </script>
</body>
</html>
