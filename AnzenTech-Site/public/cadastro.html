<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AnzenTech | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body class="cadastro-page">

  <!--header inicio-->
  <div class="header">
  <div class="container">
    <a class="logo" href="index.html" aria-label="AnzenTech - Início">
      <img class="logo-img" src="./assets/icon/安.png" alt="">
      <span class="logo-texto">Anzen<span>Tech</span></span>
    </a>
    <ul class="navbar" aria-label="Navegação principal">
      <li><a href="index.html">Início</a></li>
      <li><a href="dashboard/dashboard.html">Dashboard</a></li>
      <li><a href="simulador.html">Simulador</a></li>
    </ul>
    <div class="nav-actions">
      <a class="nav-login" href="login.html">Entrar</a>
      <a class="nav-cta agora" href="cadastro.html">Começar grátis</a>
    </div>
  </div>
</div>
    <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Crie sua conta</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>
  <!--footer inicio-->
  <div class="footer">
    <div class="container">
    </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>
  // A API atual exige o vínculo com uma empresa durante o cadastro.
  // Para testes sem código de validação, os novos usuários ficam ligados ao ID 1.
  const ID_EMPRESA_PARA_TESTE = 1;

  function mostrarErroCadastro(mensagem) {
    cardErro.style.display = "block";
    mensagem_erro.textContent = mensagem;
  }

  function limparFormulario() {
    document.getElementById("nome_input").value = "";
    document.getElementById("email_input").value = "";
    document.getElementById("senha_input").value = "";
    document.getElementById("confirmacao_senha_input").value = "";
  }

  async function cadastrar() {
    aguardar();

    var nomeVar = nome_input.value.trim();
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      mostrarErroCadastro("Preencha todos os campos.");
      finalizarAguardar();
      return false;
    }

    setInterval(sumirMensagem, 5000);

    try {
      var resposta = await fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
          idEmpresaVincularServer: ID_EMPRESA_PARA_TESTE
        }),
      });

      if (!resposta.ok) {
        throw new Error("Houve um erro ao tentar realizar o cadastro.");
      }

      mostrarErroCadastro("Cadastro realizado com sucesso! Redirecionando para tela de Login...");

      setTimeout(function () {
        window.location = "login.html";
      }, 2000);

      limparFormulario();
    } catch (erro) {
      mostrarErroCadastro(erro.message || "Não foi possível realizar o cadastro. Tente novamente.");
    } finally {
      finalizarAguardar();
    }

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
